<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Nova IA</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f1efe9;--panel:#ffffffee;--ink:#1d2330;--mut:#6b7385;--me:#1f4fd8;--ai:#e6e9f2;--line:#d9dce5;--acc:#1f4fd8;--acc2:#8a4dff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1118;--panel:#181c27ee;--ink:#e8ebf4;--mut:#8f98ad;--me:#4a74f0;--ai:#232938;--line:#2a3042;--acc:#6f93ff;--acc2:#a37bff}}
:root[data-theme="dark"]{--bg:#0e1118;--panel:#181c27ee;--ink:#e8ebf4;--mut:#8f98ad;--me:#4a74f0;--ai:#232938;--line:#2a3042;--acc:#6f93ff;--acc2:#a37bff}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 "Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
body::before,body::after{content:"";position:fixed;z-index:-1;width:60vmax;height:60vmax;border-radius:50%;filter:blur(70px);opacity:.26;animation:fl 18s ease-in-out infinite alternate}
body::before{background:var(--acc);top:-25vmax;left:-20vmax}
body::after{background:var(--acc2);bottom:-28vmax;right:-22vmax;animation-delay:-9s}
@keyframes fl{to{transform:translate(8vmax,6vmax) scale(1.15)}}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
header{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--panel);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.orb{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;color:#fff;flex:none;animation:br 3s ease-in-out infinite}
.orb svg.i{width:16px;height:16px}
.orb.big{width:68px;height:68px;margin:0 auto 14px}.orb.big svg.i{width:32px;height:32px}
@keyframes br{50%{box-shadow:0 0 0 7px #8a4dff22;transform:scale(1.06)}}
header h1{flex:1;font-size:16px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button,.btn{font:inherit;color:inherit;background:none;border:1px solid var(--line);border-radius:10px;padding:7px 9px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .12s,background .2s}
button:active{transform:scale(.92)}
button:focus-visible,textarea:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
#me{padding:2px;border-radius:50%}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;background-size:cover;background-position:center;flex:none}
#wrap{flex:1;display:flex;min-height:0;position:relative}
#scrim{position:absolute;inset:0;background:#0007;opacity:0;pointer-events:none;transition:opacity .25s;z-index:4}
#scrim.open{opacity:1;pointer-events:auto}
aside{position:absolute;inset:0 auto 0 0;width:min(300px,82%);background:var(--panel);backdrop-filter:blur(12px);border-right:1px solid var(--line);transform:translateX(-102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:5;display:flex;flex-direction:column;padding:10px;gap:8px;overflow-y:auto}
aside.open{transform:none}
.ci{display:flex;gap:6px;margin-bottom:6px;animation:in .3s both}
.ci button:first-child{flex:1;justify-content:flex-start;overflow:hidden;white-space:nowrap}
.ci.cur button:first-child{border-color:var(--acc);color:var(--acc)}
main{flex:1;display:flex;flex-direction:column;min-width:0}
#msgs{flex:1;overflow-y:auto;padding:14px max(12px,calc((100% - 760px)/2));display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.m{max-width:88%;padding:9px 13px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word;animation:pop .35s cubic-bezier(.2,.9,.3,1.25) both}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.94)}}
@keyframes in{from{opacity:0;transform:translateX(-10px)}}
.u{align-self:flex-end;background:linear-gradient(135deg,var(--me),var(--acc2));color:#fff;border-bottom-right-radius:4px}
.a{align-self:flex-start;background:var(--ai);border-bottom-left-radius:4px}
.a.cur::after{content:"";display:inline-block;width:7px;height:15px;background:var(--acc);margin-left:3px;vertical-align:-2px;animation:bl .7s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.a a{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:13px;color:var(--acc);text-decoration:none;border:1px solid var(--line);border-radius:99px;padding:4px 10px}
.a a svg.i{width:14px;height:14px}
.acts{display:flex;gap:4px;margin-top:6px}.acts button{padding:3px 7px;border:0;opacity:.6}.acts button svg.i{width:15px;height:15px}
.dots span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--mut);animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-4px)}}
#hero{margin:auto;text-align:center;padding:16px;width:100%;max-width:520px;animation:pop .5s both}
#hero h2{margin:0 0 4px;font-size:24px}#hero p{margin:0;color:var(--mut)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.cards button{flex-direction:column;align-items:flex-start;text-align:left;padding:12px;background:var(--panel);border-radius:14px;gap:8px;font-size:14px;line-height:1.3}
.cards svg.i{color:var(--acc)}
form{display:flex;gap:8px;padding:8px max(12px,calc((100% - 760px)/2)) 12px;background:var(--panel);backdrop-filter:blur(10px);border-top:1px solid var(--line);align-items:flex-end}
textarea{flex:1;resize:none;max-height:110px;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
#send{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border:0}
#mic.rec{background:#d62d3b;color:#fff;border-color:#d62d3b;animation:rp 1.2s infinite}
@keyframes rp{0%{box-shadow:0 0 0 0 #d62d3b88}100%{box-shadow:0 0 0 14px #d62d3b00}}
#st{font-size:12px;color:var(--mut);padding:0 14px 4px;min-height:16px;text-align:center}
#prof{position:fixed;inset:0;z-index:20;display:none;background:#0008;align-items:flex-end;justify-content:center}
#prof.open{display:flex;animation:fd .2s}
@keyframes fd{from{opacity:0}}
.sheet{width:min(480px,100%);max-height:92%;overflow-y:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .35s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(100%)}}
.who{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.who b{font-size:18px}.who small{display:block;color:var(--mut)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.card>small{color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.grid b{display:block;font-size:20px}.grid span{font-size:12px;color:var(--mut)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>button,.row>.btn{flex:1}
.rin{display:flex;gap:6px;margin-top:8px}
.rin input,.rin select,#tin{flex:1;min-width:0;font:inherit;font-size:14px;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:7px 10px}
.avb{width:34px;height:34px;border-radius:50%!important;padding:0!important;flex:none!important}
.avb.on{outline:3px solid var(--acc);outline-offset:2px}
.ch{font-size:12.5px;padding:5px 10px;border-radius:99px;flex:none!important}
.ch.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.go{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border:0}
.tkc{display:block;margin:8px 0;padding:8px;border-radius:8px;background:var(--bg);border:1px dashed var(--line);font:600 14px ui-monospace,monospace;word-break:break-all}
.cb{margin:8px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg);animation:pop .3s both}
.cbh{display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--line);font-size:12px;font-weight:600;flex-wrap:wrap}
.cbh span{flex:1;min-width:60px}.cbh button{padding:4px 8px;font-size:12px;border-radius:8px}
.cb pre{margin:0;padding:10px;overflow-x:auto;font:12.5px/1.5 ui-monospace,Menlo,monospace;white-space:pre}
.cb iframe{width:100%;height:300px;border:0;border-top:1px solid var(--line);background:#fff;display:block}
.imgc{margin-top:6px}.imgc>img,.pc{width:100%;max-width:520px;border-radius:12px;background:#fff;display:block;animation:pop .5s both}
.imgc .row{gap:6px;margin-top:8px}.imgc button{font-size:13px;padding:5px 9px}
.shim{width:240px;height:200px;max-width:100%;border-radius:12px;background:linear-gradient(90deg,var(--ai),var(--line),var(--ai));background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.shim+small{display:block;margin-top:6px;color:var(--mut)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* melhorias v6.1 */
button:disabled{opacity:.55;cursor:not-allowed;transform:none!important}
button[aria-busy="true"]{pointer-events:none}
body.busy #send{filter:saturate(.7)}
@media(max-width:520px){
  header{padding-left:max(8px,env(safe-area-inset-left));padding-right:max(8px,env(safe-area-inset-right))}
  #msgs{padding-left:9px;padding-right:9px}
  .m{max-width:94%}
  form{padding-left:8px;padding-right:8px}
  form button{min-width:42px;min-height:42px}
  .cards{grid-template-columns:1fr}
  .cards button{min-height:58px}
  .sheet{max-height:96%;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
  .row>button,.row>.btn{min-height:40px}
}
@media(pointer:coarse){
  button{min-height:40px}
  .acts button{min-width:38px}
}
</style>
</head>
<body>
<header>
  <button id="menu" data-ic="menu"></button>
  <div class="orb" data-ic="spark"></div>
  <h1 id="title">Nova IA</h1>

  <button id="vox"></button>
  <button id="me"></button>
</header>
<div id="wrap">
  <div id="scrim"></div>
  <aside id="side">
    <button id="new"><span data-ic="plus"></span><span id="newl"></span></button>
    <div id="list"></div>
  </aside>
  <main>
    <div id="msgs" aria-live="polite"></div>
    <div id="st"></div>
    <form id="f">
      <button type="button" id="mic" data-ic="mic"></button>
      <button type="button" id="studio" data-ic="image"></button>
      <textarea id="in" rows="1" enterkeyhint="send"></textarea>
      <button id="send" data-ic="send"></button>
    </form>
  </main>
</div>
<div id="prof"><div class="sheet" id="sheet"></div></div>

function calc(t){
  let e=t.replace(/(quanto e|quanto eh|how much is|what is|cuanto es|calcule|calcular|calculate|resultado de|resolva)/g,'').replace(/(\d)\s*por\s*(\d)/g,'$1*$2')
    .replace(/mais|plus/g,'+').replace(/menos|minus/g,'-').replace(/dividido por|dividido|divided by|sobre/g,'/')
    .replace(/vezes|veces|times|multiplicado por|multiplied by|\bx\b/g,'*').replace(/elevado a|\^/g,'**').replace(/(\d),(\d)/g,'$1.$2').replace(/[?=]/g,'').trim();
  if(!/\d/.test(e)||!/^[\d+\-*/().%\s]+$/.test(e)||!/[+\-*/%]/.test(e))return null;
  try{const v=Function('"use strict";return ('+e+')')();if(typeof v!=='number'||!isFinite(v))return '—';return '= '+(+v.toFixed(6)).toLocaleString(navigator.language)}catch(x){return null}}
function learned(t){const q=new Set(toks(t));if(!q.size)return null;let best=null,bs=0;
  for(const f of S.mem.facts){const k=toks(f.q);if(!k.length)continue;const sc=k.filter(w=>q.has(w)).length/Math.max(k.length,q.size);if(sc>bs){bs=sc;best=f}}
  return bs>=0.5?best.a:null}

function think(raw){
  const t=norm(raw);let m;
  if(m=raw.match(/^\s*(?:pesquise|pesquisa|busque|buscar|google|procure|search|look up|busca|recherche|cherche)\s+(?:por\s+|sobre\s+|about\s+|for\s+|de\s+|sur\s+|información sobre\s+)?(.+)/i))return{web:m[1].trim()};
  if(new RegExp('^(?:'+CREATE+')\\b.*\\b(?:'+IMGW+')\\b').test(t)||/^(?:desenhe|desenha|draw|dibuja|dessine)\s+\S+/.test(t))return{img:raw};
  if(new RegExp('^(?:'+CREATE+'|escreva|escreve|monte|programe|write|build|code|escribe|ecris)\\b.*\\b(?:'+CODEW+')\\b').test(t))return{code:raw};
  if(m=raw.match(/^\s*(?:aprenda|lembre|memorize|learn|remember|aprende|recuerda|apprends)\s*:?\s*(.+?)\s*=\s*(.+)$/i)){S.mem.facts.push({q:m[1],a:m[2]});return L('Anotado!')}

  if(/(qual (e )?(o )?meu nome|what is my name|cual es mi nombre|who am i|quem sou eu)/.test(t))return uname()?L('Seu nome é')+' '+uname()+'.':L('Ainda não sei seu nome.');
  if(/^(oi|ola|e ai|opa|bom dia|boa tarde|boa noite|hello|hi|hey|good morning|good evening|hola|buenos dias|buenas tardes|buenas noches|bonjour|salut)\b/.test(t))return L('Olá')+(uname()?', '+uname():'')+'! '+L('Como posso ajudar hoje?');
  if(/(tudo bem|como vai|how are you|como estas|como esta voce)/.test(t))return L('Tudo ótimo por aqui! E você?');
  if(/(quem (e )?voce|who are you|quien eres|o que (e )?voce)/.test(t))return L('Sou a Nova, uma IA feita do zero em HTML e JavaScript. Crio paisagens realistas, ilustrações e códigos, e busco respostas na web.');
  if(/(que horas|horas sao|what time|que hora)/.test(t))return L('Agora são')+' '+new Date().toLocaleTimeString(navigator.language,{hour:'2-digit',minute:'2-digit'})+'.';
  if(/(que dia|data de hoje|what day|date today|que fecha|dia es hoy)/.test(t))return L('Hoje é')+' '+new Date().toLocaleDateString(navigator.language,{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'.';
  if(/(obrigad|valeu|thanks|thank you|gracias)/.test(t))return L('De nada!');
  if(/^(tchau|ate mais|adeus|bye|goodbye|adios|hasta luego)/.test(t))return L('Até mais!');
  if(/^(ajuda|help|ayuda|aide|comandos)/.test(t))return L('ajuda_texto');
  return calc(t)||learned(raw)||null}

function tidy(raw){const i=raw.search(/<svg[\s>]/i);if(i<0)return null;let t=raw.slice(i);const e=t.search(/<\/svg>/i);if(e>=0)return t.slice(0,e+6);
  t=t.replace(/<[^>]*$/,'');const st=[];t.replace(/<(\/?)([a-zA-Z][\w:-]*)[^>]*?(\/?)>/g,(m,c,n,sf)=>{if(sf)return m;if(c){const k=st.lastIndexOf(n);if(k>=0)st.length=k}else st.push(n);return m});
  return t+st.reverse().map(n=>'</'+n+'>').join('')}
function cleanSvg(raw){const m=tidy(raw);if(!m)return null;
  const doc=new DOMParser().parseFromString(m,'image/svg+xml');if(doc.querySelector('parsererror'))return null;
  if(doc.querySelectorAll('path,rect,circle,ellipse,polygon,line,polyline').length<3)return null;
  doc.querySelectorAll('script,foreignObject,iframe,use').forEach(n=>n.remove());
  doc.querySelectorAll('*').forEach(n=>[...n.attributes].forEach(x=>{if(/^on/i.test(x.name)||/javascript:|https?:/i.test(x.value)&&/href/i.test(x.name))n.removeAttribute(x.name)}));
  const r=doc.documentElement;if(!r.getAttribute('viewBox')){const w=parseFloat(r.getAttribute('width'))||512,h=parseFloat(r.getAttribute('height'))||512;r.setAttribute('viewBox','0 0 '+w+' '+h)}
  const v=r.getAttribute('viewBox').split(/[\s,]+/).map(Number);r.setAttribute('width',v[2]);r.setAttribute('height',v[3]);r.setAttribute('xmlns','http://www.w3.org/2000/svg');
  return new XMLSerializer().serializeToString(r)}

function applyFx(svg,fx){if(!fx||!fx.length)return svg;const o=svg.match(/<svg[^>]*>/)[0];
  const [x,y,w,h]=((o.match(/viewBox="([^"]+)"/)||[0,'0 0 512 512'])[1]).split(/[\s,]+/).map(Number);
  const inner=svg.slice(o.length,svg.lastIndexOf('</svg>'));let defs='',top='',base='<g>'+inner+'</g>';
  const R=e=>'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" '+e+'/>';
  if(fx.includes('glow')){defs+='<filter id="nfg" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="'+(w/45)+'"/></filter>';base='<g filter="url(#nfg)" opacity=".55" style="mix-blend-mode:screen">'+inner+'</g>'+base}
  if(fx.includes('cin')){defs+='<linearGradient id="nfc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9a4a" stop-opacity=".35"/><stop offset="1" stop-color="#1f6f8f" stop-opacity=".4"/></linearGradient>';top+=R('fill="url(#nfc)" style="mix-blend-mode:soft-light"')}
  if(fx.includes('vig')){defs+='<radialGradient id="nfv" cx=".5" cy=".5" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".6"/></radialGradient>';top+=R('fill="url(#nfv)"')}
  if(fx.includes('gr')){defs+='<filter id="nfn" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 .5 0"/></filter>';top+=R('filter="url(#nfn)" opacity=".4"')}
  if(fx.includes('frm')){const p=w*.035;top+='<rect x="'+(x+p/2)+'" y="'+(y+p/2)+'" width="'+(w-p)+'" height="'+(h-p)+'" fill="none" stroke="#fff" stroke-width="'+p+'"/>'}

  if((r===null||typeof r==='object')&&!S.online&&!photo)r=L('Não sei isso ainda e a busca na web está desligada.');
  if(typeof r==='string'){await new Promise(z=>setTimeout(z,250+Math.random()*300));await typeIn(d,r);const m={r:'a',t:r};c.msgs.push(m);addActs(d,r);speak(r)}

    if(S.online){try{Object.assign(sc,await aiScene(text));if(S.img.time!=='auto'&&TM[S.img.time])sc.time=S.img.time}catch(e){}}
    sc.prompt=text;

    d.textContent=m.t;await new Promise(z=>setTimeout(z,60));decorate(d,m);c.msgs.push(m);S.acc.images++;speak(L('Sua imagem está pronta.'));$('st').textContent=''}
  else{
    $('st').textContent=kind==='img'?L('Criando a imagem…'):kind==='code'?L('Escrevendo o código…'):L('Buscando a resposta…');
    let out='',ok=true,svg=null;

    d.classList.remove('cur');d.textContent='';if(out.includes('```'))rich(d,out,true);else fmt(d,out);
    if(ok){if(kind==='web')S.acc.searches++;if(kind==='img')S.acc.images++}
    const m={r:'a',t:out,g:kind==='web'?q:undefined,img:svg||undefined,fx:svg?S.img.fx.slice():undefined,p:svg?text:undefined};
    decorate(d,m);c.msgs.push(m);speak(kind==='code'&&ok?L('Pronto, o código está na tela.'):kind==='img'&&ok?L('Sua imagem está pronta.'):out);$('st').textContent=''}
  save();box.scrollTop=box.scrollHeight;busy=false}

(function(){
  'use strict';

  // Acessibilidade e feedback visual
  const toast=(msg,ms=1800)=>{
    const st=document.getElementById('st');
    if(!st)return;
    st.textContent=msg;
    clearTimeout(window.__novaToast);
    window.__novaToast=setTimeout(()=>{if(st.textContent===msg)st.textContent=''},ms);
  };
  const setBusy=(v)=>{
    document.body.classList.toggle('busy',!!v);
    const send=document.getElementById('send');
    if(send){send.disabled=!!v;send.setAttribute('aria-busy',v?'true':'false')}
  };

  // Download funciona também sem o ambiente externo.
  window.dl=async function(name,data){
    try{
      let blob;
      if(data instanceof Blob) blob=data;
      else if(data instanceof ArrayBuffer) blob=new Blob([data]);
      else if(typeof data==='string') blob=new Blob([data],{type:name.endsWith('.svg')?'image/svg+xml;charset=utf-8':'text/plain;charset=utf-8'});
      else throw new Error('unsupported');
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url;a.download=name;a.rel='noopener';a.style.display='none';
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),1500);
      toast('✓ '+name);
      return true;
    }catch(e){
      toast(L('Não consegui baixar aqui. Use Copiar.'));
      return false;
    }
  };

  // Clipboard com fallback mais confiável.
  window.copyText=async function(t){
    try{
      if(navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(String(t));
      else{
        const a=document.createElement('textarea');
        a.value=String(t);a.setAttribute('readonly','');
        a.style.position='fixed';a.style.opacity='0';
        document.body.appendChild(a);a.focus();a.select();
        if(!document.execCommand('copy'))throw new Error('copy');
        a.remove();
      }
      toast(L('Copiado!'));
      return true;
    }catch(e){toast('Não foi possível copiar.');return false}
  };

  // Exportação de imagem robusta: SVG -> PNG/JPG usando Blob URL.
  window.svgToFile=async function(svg,type,name){
    return new Promise(resolve=>{
      try{
        const m=svg.match(/viewBox=["']([^"']+)["']/i);
        const v=(m?m[1]:'0 0 512 512').split(/[\s,]+/).map(Number);
        const W=1600,H=Math.max(1,Math.round(W*v[3]/v[2]));
        const blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'});
        const url=URL.createObjectURL(blob),im=new Image();
        im.onload=()=>{
          const c=document.createElement('canvas');c.width=W;c.height=H;
          const x=c.getContext('2d');
          x.fillStyle='#fff';x.fillRect(0,0,W,H);x.drawImage(im,0,0,W,H);
          URL.revokeObjectURL(url);
          c.toBlob(b=>{if(b)dl(name,b).then(()=>resolve(true));else resolve(false)},type,.94);
        };
        im.onerror=()=>{URL.revokeObjectURL(url);resolve(false)};
        im.src=url;
      }catch(e){resolve(false)}
    });
  };

  // Corrige o botão PNG/SVG das imagens geradas.
  window.imgCard=function(d,m){
    const w=document.createElement('div');w.className='imgc';
    const im=new Image();im.alt='Imagem criada pela Nova IA';im.loading='lazy';
    const cur=()=>applyFx(m.img,m.fx||[]);
    const show=()=>{im.src=svgUri(cur())};
    show();
    const fr=rowEl();
    FXS.forEach(([id,l])=>{
      const b=chip(l,(m.fx||[]).includes(id),()=>{
        const a=m.fx=m.fx||[],i=a.indexOf(id);
        if(i<0)a.push(id);else a.splice(i,1);
        b.classList.toggle('on',i<0);show();save();
      });
      fr.appendChild(b);
    });
    const row=rowEl();
    row.appendChild(mk('down','PNG',()=>svgToFile(cur(),'image/png','nova-imagem.png')));
    row.appendChild(mk('down','JPG',()=>svgToFile(cur(),'image/jpeg','nova-imagem.jpg')));
    row.appendChild(mk('down','SVG',()=>dl('nova-imagem.svg',cur())));
    row.appendChild(mk('copy',L('Copiar'),()=>copyText(cur())));
    if(m.p)row.appendChild(mk('spark',L('Variação'),()=>{if(!busy)ask(m.p,'img')}));
    w.append(im,fr,row,refineBox('Refinar: deixe mais escuro, adicione a lua…',async inp=>{
      const ins=inp.value.trim();if(!ins||busy)return;
      busy=true;setBusy(true);im.style.opacity='.4';toast(L('Refinando…'));
      try{
        const n=cleanSvg(await aiCall(refinePrompt(m.img,ins),()=>{},'complex'));
        if(!n)throw{code:'badsvg'};
        m.img=n;inp.value='';save();show();toast('✓');
      }catch(e){
        toast(e&&e.code==='badsvg'?L('Não consegui criar a imagem. Tente descrever de outro jeito.'):errText(e),3000);
      }finally{im.style.opacity='';busy=false;setBusy(false)}
    }));
    d.appendChild(w);
  };

  // Canvas de paisagens: download sem depender da nuvem.
  window.photoCard=function(d,m){
    const sc=m.photo,w=document.createElement('div');w.className='imgc';
    const cv=document.createElement('canvas');cv.className='pc';cv.setAttribute('role','img');cv.setAttribute('aria-label','Imagem de paisagem');
    const draw=()=>{try{renderScene(cv,sc,960)}catch(e){toast(L('Não consegui criar a imagem. Tente descrever de outro jeito.'),3000)}};
    const ctl=document.createElement('div');
    const build=()=>{ctl.innerHTML='';const r1=rowEl(),r2=rowEl();
      [['auto','Automático'],...TIMES].forEach(([id,l])=>r1.appendChild(chip(l,sc.time===id,()=>{
        if(id==='auto')sc.time=parseScene(sc.prompt||'').time;
        else sc.time=id;
        if(id==='night')sc.moon=true;upd();
      })));
      r2.appendChild(chip('Neblina',(sc.fog||0)>.4,()=>{sc.fog=(sc.fog||0)>.4?.1:.7;upd()}));
      FXP.forEach(([id,l])=>r2.appendChild(chip(l,(sc.fx||[]).includes(id),()=>{
        const a=sc.fx=sc.fx||[],i=a.indexOf(id);i<0?a.push(id):a.splice(i,1);upd();
      })));
      ctl.append(r1,r2)
    };
    const upd=()=>{draw();build();save()};
    const big=(type,ext)=>{const c=document.createElement('canvas');renderScene(c,sc,1920);c.toBlob(b=>b&&dl('nova-foto.'+ext,b),type,.93)};
    const row=rowEl();
    row.append(mk('down','PNG',()=>big('image/png','png')),mk('down','JPG',()=>big('image/jpeg','jpg')),mk('spark',L('Variação'),()=>{sc.seed=Math.floor(Math.random()*1e9);upd()}));
    draw();build();
    w.append(cv,ctl,row,refineBox('Refinar: mais neblina, adicione a lua…',async inp=>{
      const ins=inp.value.trim();if(!ins||busy)return;
      busy=true;setBusy(true);toast(L('Refinando…'));
      try{Object.assign(sc,await aiScene(ins,sc));inp.value='';upd();toast('✓')}
      catch(e){toast(errText(e),3000)}
      finally{busy=false;setBusy(false)}
    }));
    d.appendChild(w);
  };

  // Melhor suporte para teclado e fechamento.
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){
      const p=document.getElementById('prof'),side=document.getElementById('side');
      if(p&&p.classList.contains('open'))p.classList.remove('open');
      if(side&&side.classList.contains('open'))toggle(false);
      if(window.speechSynthesis)speechSynthesis.cancel();
    }
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){
      e.preventDefault();document.getElementById('in')?.focus();
    }
  });

  // Corrige o botão de voz: estado sempre volta ao normal.
  const mic=document.getElementById('mic');
  if(mic){
    mic.addEventListener('dblclick',()=>{try{rec&&rec.abort()}catch(e){}});
  }

  // Botão de fechar o perfil ao tocar no fundo + bloqueio de scroll do fundo.
  const prof=document.getElementById('prof');
  if(prof){
    const syncModal=()=>document.body.style.overflow=prof.classList.contains('open')?'hidden':'';
    new MutationObserver(syncModal).observe(prof,{attributes:true,attributeFilter:['class']});
  }

  // Indicador de conectividade real.
  window.addEventListener('online',()=>{S.online=true;syncUI();save();toast('✓ Internet disponível')});
  window.addEventListener('offline',()=>{S.online=false;syncUI();save();toast('Sem internet — modo local')});

  // Segurança/consistência dos dados carregados.
  try{
    S.chats=Array.isArray(S.chats)?S.chats:[];
    S.mem=S.mem&&typeof S.mem==='object'?S.mem:{name:'',facts:[]};
    S.mem.facts=Array.isArray(S.mem.facts)?S.mem.facts:[];
    S.img=S.img&&typeof S.img==='object'?S.img:{style:'auto',ratio:'1:1',time:'auto',fx:['vig','gr']};
    S.img.fx=Array.isArray(S.img.fx)?S.img.fx:[];
    S.acc=S.acc&&typeof S.acc==='object'?S.acc:{msgs:0,images:0,searches:0,joined:'',utoken:''};
    S.profile=S.profile&&typeof S.profile==='object'?S.profile:{name:'',photo:'',av:0};
    if(!S.chats.length){newChat();save()}
  }catch(e){console.warn('Dados locais corrigidos',e)}

  // Melhora o botão "Novo chat": não cria dezenas de conversas vazias.
  const newBtn=document.getElementById('new');
  if(newBtn)newBtn.onclick=()=>{
    const c=chat();
    if(c&&!c.msgs.length){toggle(false);document.getElementById('in')?.focus();return}
    newChat();save();renderChat();toggle(false);document.getElementById('in')?.focus();
  };

  // Contagem e estado do envio.
  const input=document.getElementById('in');
  if(input){
    input.setAttribute('aria-label',L('Pergunte qualquer coisa…'));
    input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,110)+'px'});
  }

  // Atalhos de envio e foco.
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden && window.speechSynthesis)speechSynthesis.cancel();
  });

  // Atualiza title e tooltips imediatamente.
  try{applyLang();syncUI()}catch(e){}
})();

</script>
</body>
</html>
